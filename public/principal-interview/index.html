<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principal's Reflection — DA Tuition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --ink:#071629;--gold:#c9a227;--gold-soft:#ead8a2;
  --paper:#fbf3e6;--paper-2:#f6ead8;
  --navy:#071629;--navy-2:#0a1d36;
  --muted:#5a6477;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.serif{font-family:'Playfair Display',Georgia,serif}

/* ─── NAV ─── */
/* ─── HERO ─── */
.hero{
  background-image:url("images/hero-frame-bg.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,3.6vh,36px);
  position:relative;overflow:hidden;
  padding:130px 0 clamp(24px,5vh,48px);
}
.hero-fold{display:block;width:100%;height:clamp(38px,5.5vh,56px);margin-top:clamp(2px,1vh,10px);position:relative}
.hero-fold-spark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:var(--gold-soft);font-size:13px;line-height:1;text-shadow:0 0 8px rgba(201,162,39,.75)}
.hero-inner{max-width:min(1240px,78%);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(260px,.82fr);gap:52px;align-items:center;width:100%}
.hero-text{margin-left:clamp(16px,5vw,64px)}

.hero-eyebrow{font-size:clamp(0.72rem,1vw,0.95rem);font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.hero-eyebrow-rule{width:min(360px,100%);height:1px;background:linear-gradient(to right,rgba(201,162,39,.78),rgba(201,162,39,.35));position:relative;margin:0 0 28px}
.hero-eyebrow-rule span{position:absolute;left:50%;top:50%;width:6px;height:6px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.hero-h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.6rem,4vw,4.35rem);font-weight:700;line-height:1.1;color:var(--ink);margin-bottom:24px;letter-spacing:.01em}
.hero-h1 span,.hero-h1 em{display:block}
.hero-h1 em{color:var(--gold);font-style:normal}
.hero-title-line{min-height:1.1em}
.hero-title-final{display:flex;align-items:baseline;gap:.18em;min-height:1.1em}
.rotating-word{display:inline-block;min-width:3.8em;color:var(--gold);position:relative;overflow:hidden;vertical-align:baseline;visibility:hidden}
.rotating-word.is-visible{visibility:visible}
.rotating-word span{display:inline-block;animation:word-swipe-up .42s cubic-bezier(.22,.61,.36,1)}
@keyframes word-swipe-up{from{opacity:0;transform:translateY(80%)}to{opacity:1;transform:translateY(0)}}
.hero-h1 .typing-cursor{display:none}
.typing-cursor.done{animation:none;opacity:0}
.hero-sub{font-size:clamp(1rem,1.3vw,1.28rem);line-height:1.55;color:var(--ink);max-width:48ch;margin-bottom:26px;font-style:italic}
.hero-sub p{margin:0 0 12px}
.hero-sub p:last-child{margin-bottom:0}
.hero-sub-strong{font-weight:700}
.byline{display:flex;align-items:flex-start}
.byline-name{font-family:'Great Vibes','Brush Script MT',cursive;font-size:39px;font-weight:400;line-height:1;color:var(--gold)}
.byline-role{font-size:18px;color:var(--ink);margin-top:8px}
.reflection-cta{display:inline-flex;align-items:center;gap:18px;margin-top:32px;font-size:clamp(0.78rem,1vw,0.98rem);font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.reflection-cta span:first-child{border-bottom:2px solid var(--gold);padding-bottom:7px}
.reflection-cta span:last-child{font-size:1.7em;line-height:1;color:var(--gold);transform:translateY(-1px);transition:transform .22s ease}
.reflection-cta:hover span:last-child,.reflection-cta:focus-visible span:last-child{transform:translate(5px,-1px)}

/* ─── SIDE BADGES ─── */
.hero-side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:20px;z-index:2;width:112px;pointer-events:none}
.hero-side-left{left:clamp(0px,0.4vw,8px)}
.hero-side-right{right:clamp(0px,0.4vw,8px)}
.hero-side-label{width:100%;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-soft);text-align:center;line-height:1.5;white-space:nowrap;text-shadow:0 1px 3px rgba(7,22,41,.85),0 0 8px rgba(7,22,41,.6)}
.hero-side-rule{width:32px;height:1px;background:var(--gold);position:relative}
.hero-side-rule span{position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
@media (max-width:1180px){.hero-side{display:none}}

/* ─── PRINCIPAL'S VOICE BOOK (transparent PNG — book + pedestal + badge) ─── */
.book-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.book-visual{
  appearance:none;border:none;background:none;padding:0;
  cursor:pointer;display:block;
  width:clamp(296px,37.2vw,468px);
  max-width:100%;
  transition:transform .45s cubic-bezier(.22,.61,.36,1),filter .45s cubic-bezier(.22,.61,.36,1);
  filter:drop-shadow(12px 18px 20px rgba(7,27,53,.18));
}
.book-visual img{width:100%;height:auto;display:block;pointer-events:none}
.book-visual:hover,.book-visual:focus-visible{
  transform:translateY(-5px) scale(1.015);
  filter:drop-shadow(12px 18px 20px rgba(7,27,53,.18)) drop-shadow(0 0 14px rgba(201,162,39,.3));
}
.book-visual:focus-visible{outline:3px solid var(--gold-soft);outline-offset:8px}
.book-visual.opened{
  transform:translateY(-3px) scale(1.02);
  filter:drop-shadow(12px 18px 20px rgba(7,27,53,.18)) drop-shadow(0 0 18px rgba(201,162,39,.38));
}

@media (prefers-reduced-motion: reduce){
  .book-visual{transition:filter .3s ease}
  .book-visual:hover,.book-visual:focus-visible,.book-visual.opened{transform:none}
  .rotating-word span{animation:none}
}

/* ─── HERO QUOTE ─── */
.hero-quote{width:100%;max-width:min(760px,58%);margin:0 auto;text-align:center;padding:0 24px}
.hero-quote-rule{width:56px;height:1px;background:var(--gold);margin:0 auto 16px}
.hero-quote blockquote{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  font-size:clamp(0.95rem,1.5vw,1.2rem);color:var(--ink);line-height:1.5;margin:0;
}
.hero-quote-mark{color:var(--gold);font-size:1.3em;vertical-align:-.1em}

/* ─── INTERVIEW SECTION ─── */
.interview{background:var(--paper);padding:100px 0;}
.interview.visible{display:block}
.hero-fold-reflection{margin-top:-64px;margin-bottom:0;text-align:center;transform:scaleY(-1);opacity:.12;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0) 80%);mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0) 80%);pointer-events:none}
.hero-fold-reflection blockquote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(0.85rem,1.3vw,1.05rem);color:var(--ink);line-height:1.5;margin:0;padding:0 12%}
.section-inner{max-width:1280px;margin:0 auto;padding:0 56px}

.iv-header{text-align:center;margin-bottom:72px}
.iv-eyebrow{font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.iv-header.iv-play .iv-eyebrow{opacity:1;transform:translateY(0)}
.iv-h2{font-family:'Playfair Display',serif;font-size:clamp(3.3rem,5.25vw,4.8rem);font-weight:700;color:var(--ink);line-height:1.08;margin-bottom:0}
.iv-cursor{display:inline-block;width:.05em;height:.82em;background:var(--gold);margin-left:.06em;vertical-align:-0.06em;animation:iv-blink 1s step-end infinite;transition:opacity .4s ease}
.iv-cursor.iv-done{animation:none;opacity:0}
@keyframes iv-blink{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .iv-eyebrow{opacity:1;transform:none;transition:none}
  .iv-cursor{display:none}
}
.iv-lede{font-size:16px;color:var(--muted);max-width:50ch;margin:0 auto}

.qa-list{max-width:900px;margin:0 auto}
.qa{padding:60px 0;border-top:1px solid rgba(7,22,41,.12)}
.qa:first-child{border-top:none}
.qa-head{display:flex;align-items:flex-start;gap:22px;margin-bottom:20px}
.qa-num{font-family:'Playfair Display',serif;font-size:36px;color:var(--gold);line-height:1;flex:none;width:52px;font-weight:400}
.qa-q{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,2.2vw,1.75rem);line-height:1.3;color:var(--ink);font-weight:600;padding-top:4px}
.qa-attr{margin:0 0 20px 74px;padding-bottom:20px;border-bottom:1px solid rgba(201,162,39,.2)}
.qa-attr-name{font-size:13px;font-weight:700;color:var(--ink)}
.qa-attr-role{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.qa-body{padding-left:74px}
.qa-p{font-size:16.5px;line-height:1.8;color:#3a4455;margin-bottom:18px;font-family:Georgia,'Times New Roman',serif}
.qa-quote{
  margin:28px 0 0;padding:10px 0 10px 26px;
  border-left:3px solid var(--gold);
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:1.55;
  color:var(--ink);
}

/* ─── CTA ─── */
.cta{background:linear-gradient(150deg,#061224 0%,#0a1d36 52%,#071629 100%);padding:100px 0;text-align:center;}
.cta.visible{display:block}
.cta-inner{max-width:640px;margin:0 auto;padding:0 56px}
.cta-eyebrow{font-size:10px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.cta-h2{font-family:'Playfair Display',serif;font-size:clamp(2rem,3.5vw,3rem);font-weight:600;color:#fff;line-height:1.15;margin-bottom:18px}
.cta-p{font-size:16px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:36px}
.cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-gold{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--ink);border:none;border-radius:999px;padding:0 32px;height:52px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 24px rgba(201,162,39,.35);transition:all .18s;text-decoration:none}
.btn-gold:hover{background:#b8911f;transform:translateY(-1px)}
.btn-outline-light{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:0 30px;height:52px;font-size:14px;font-weight:600;cursor:pointer;transition:background .18s;text-decoration:none}
.btn-outline-light:hover{background:rgba(255,255,255,.08)}

/* ─── FOOTER ─── */
.foot{background:#050d1c;border-top:1px solid rgba(255,255,255,.07);padding:28px 0;}
.foot.visible{display:block}
.foot-inner{max-width:1280px;margin:0 auto;padding:0 56px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(255,255,255,.35);flex-wrap:wrap;gap:8px}



/* ─── PHOTO DIVIDER Q&A LAYOUT ─── */
.iv-qa-new{max-width:1100px;margin:0 auto;padding:0 56px}

.qa-new{margin-bottom:0}

/* Full-width photo strip with question overlaid */
.qa-photo-strip{
  position:relative;width:100%;height:540px;
  overflow:hidden;border-radius:14px;
  margin-bottom:0;
}
.qa-strip-img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.qa-strip-overlay{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(6,14,28,.0) 0%,
    rgba(6,14,28,.18) 40%,
    rgba(6,14,28,.62) 72%,
    rgba(6,14,28,.82) 100%
  );
}
.qa-strip-content{
  position:absolute;bottom:0;left:0;right:0;
  z-index:1;
  padding:36px 48px;width:100%;
}
.qa-strip-num{
  font-family:'Playfair Display',Georgia,serif;
  font-size:13px;font-weight:400;font-style:italic;
  color:var(--gold);letter-spacing:.08em;
  margin-bottom:10px;display:block;opacity:.9;
}
.qa-strip-q{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(1.8rem,3vw,2.6rem);
  font-weight:600;line-height:1.25;color:#fff;
  max-width:700px;
}

.qa-strip-img{transition:filter .9s ease,opacity .9s ease,transform .9s ease}
.qa-photo-strip.qa-blur-pending .qa-strip-img{filter:blur(18px);opacity:0;transform:scale(1.06)}
.qa-photo-strip.qa-blur-pending.qa-in-view .qa-strip-img{filter:blur(0);opacity:1;transform:scale(1)}
.qa-photo-strip.qa-found{box-shadow:0 0 0 3px var(--gold)}
@media (prefers-reduced-motion: reduce){
  .qa-photo-strip.qa-blur-pending .qa-strip-img{filter:none;opacity:1;transform:none}
}

/* ─── PREMIUM INDEX CARD ─── */
.iv-index{
  max-width:900px;margin:0 auto 64px;
  background:#fdf9f0;
  border:1px solid rgba(201,162,39,.32);
  border-radius:26px;
  box-shadow:0 24px 48px rgba(7,27,53,.10),inset 0 1px 0 rgba(255,255,255,.7);
  padding:14px 22px;
  text-align:left;
}
.iv-index-group{border-top:1px solid rgba(201,162,39,.16)}
.iv-index-group:first-child{border-top:none}

/* Category header row */
.iv-index-head{
  display:flex;align-items:center;gap:14px;
  padding:18px 14px;
  cursor:pointer;
  font-size:13px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink);
  background:transparent;
  border:1px solid transparent;
  border-radius:14px;
  width:100%;text-align:left;
  font-family:'Playfair Display',Georgia,serif;
  transition:background .3s ease,border-color .3s ease,box-shadow .3s ease,transform .3s cubic-bezier(.22,.61,.36,1);
}
.iv-chevron-circle{
  flex:none;width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(201,162,39,.55);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .3s ease,background .3s ease;
}
.iv-index-head .iv-chevron{transition:transform .3s cubic-bezier(.22,.61,.36,1);color:var(--gold);font-size:11px;line-height:1;display:inline-block}
.iv-index-group.open .iv-chevron{transform:rotate(90deg)}
.iv-head-divider{flex:none;position:relative;width:1px;height:20px;background:rgba(201,162,39,.4)}
.iv-head-dot{position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.iv-head-label{flex:1}

.iv-index-head:hover,.iv-index-head:focus-visible{
  background:rgba(201,162,39,.08);
  border-color:rgba(201,162,39,.55);
  box-shadow:0 0 0 1px rgba(201,162,39,.4),0 10px 22px rgba(201,162,39,.16),0 6px 14px rgba(7,27,53,.06);
  transform:translateY(-2px);
  outline:none;
}
.iv-index-head:hover .iv-chevron-circle,.iv-index-head:focus-visible .iv-chevron-circle{border-color:var(--gold);background:rgba(201,162,39,.14)}
.iv-index-head:hover .iv-head-dot,.iv-index-head:focus-visible .iv-head-dot{background:#e0b93a}
.iv-index-group.open .iv-index-head{background:#fffdf7;border-color:rgba(201,162,39,.4)}

/* Expanded panel */
.iv-index-list{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.22,.61,.36,1)}
.iv-index-group.open .iv-index-list{max-height:900px}
.iv-group-rule{padding:2px 14px 16px;display:flex;justify-content:center}
.iv-group-rule span{position:relative;width:100%;max-width:220px;height:1px;background:linear-gradient(to right,transparent,rgba(201,162,39,.55),transparent)}
.iv-group-rule span::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}

/* Question rows */
.iv-index-item{
  display:flex;align-items:center;gap:12px;
  padding:15px 14px;
  font-size:14.5px;color:var(--ink);
  cursor:pointer;
  border-radius:12px;
  background:transparent;
  border:1px solid transparent;
  border-top:1px solid rgba(201,162,39,.14);
  width:100%;text-align:left;
  font-family:'Inter',system-ui,sans-serif;
  min-height:44px;
  transition:background .28s ease,border-color .28s ease,box-shadow .28s ease;
}
.iv-index-item:first-of-type{border-top:none}
.iv-idx-num{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-size:14px;flex:none;width:24px;transition:color .28s ease}
.iv-idx-divider{flex:none;position:relative;width:1px;height:18px;background:rgba(201,162,39,.35)}
.iv-idx-dot{position:absolute;left:50%;top:50%;width:4px;height:4px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.iv-idx-text{flex:1;color:var(--ink)}
.iv-idx-chevron{flex:none;color:rgba(201,162,39,.6);font-size:16px;transition:transform .28s ease,color .28s ease}

.iv-index-item:hover,.iv-index-item:focus-visible{
  background:linear-gradient(to right,rgba(201,162,39,.1),rgba(201,162,39,.03));
  border-color:rgba(201,162,39,.5);
  box-shadow:0 0 0 1px rgba(201,162,39,.35),inset 0 0 14px rgba(201,162,39,.08);
  outline:none;
}
.iv-index-item:hover .iv-idx-chevron,.iv-index-item:focus-visible .iv-idx-chevron{transform:translateX(3px);color:var(--gold)}
.iv-index-item:hover .iv-idx-num,.iv-index-item:focus-visible .iv-idx-num{color:#e0b93a}

@media (prefers-reduced-motion: reduce){
  .iv-index-head,.iv-index-item{transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
  .iv-index-head:hover,.iv-index-head:focus-visible{transform:none}
  .iv-index-list{transition:none}
}

/* Response area below the photo strip */
.qa-response{
  background:#fff;
  border:1px solid rgba(7,22,41,.08);
  border-top:none;
  border-radius:0 0 14px 14px;
  padding:40px 48px 48px;
  margin-bottom:52px;
}
.qa-resp-attr{
  display:flex;align-items:center;gap:12px;
  padding-bottom:24px;margin-bottom:28px;
  border-bottom:1px solid rgba(201,162,39,.18);
}
.qa-resp-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0}
.qa-resp-name{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.qa-resp-role{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-left:4px}
.qa-resp-p{
  font-family:Georgia,'Times New Roman',serif;
  font-size:17px;line-height:1.85;color:#2e3a4e;margin-bottom:20px;
}
.qa-resp-quote{
  border-left:3px solid var(--gold);
  padding:2px 0 2px 24px;
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.6;
  color:var(--ink);margin-top:28px;
}

@media (max-width:960px){
  .hero-inner{max-width:88%;padding:0 24px;gap:28px;grid-template-columns:minmax(0,1.08fr) minmax(180px,.92fr)}
  .hero-h1{font-size:clamp(2rem,5vw,2.6rem);line-height:1.02;margin-bottom:16px}
  .hero-eyebrow-rule{margin-bottom:16px}
  .hero-sub{font-size:14px;line-height:1.5;max-width:42ch;margin-bottom:18px}
  .hero-sub p{margin-bottom:10px}
  .book-visual{width:clamp(250px,40.8vw,374px)}
  .hero-quote{max-width:80%}
  .iv-index{padding:12px 14px;border-radius:22px}
  .iv-index-head{padding:16px 10px;gap:10px}
  .iv-index-item{padding:14px 10px;gap:10px}
  .iv-idx-text{padding-right:4px}
}

@media (max-width:680px){
  .hero{min-height:auto;padding:112px 0 48px}
  .hero-fold{height:32px}
  .hero-inner{max-width:92%;grid-template-columns:1fr;text-align:center;gap:36px}
  .hero-h1{font-size:clamp(2.1rem,9vw,2.7rem)}
  .hero-title-final{justify-content:center;flex-wrap:wrap}
  .rotating-word{min-width:3.6em}
  .hero-eyebrow-rule{margin-left:auto;margin-right:auto}
  .hero-sub{margin-left:auto;margin-right:auto}
  .byline{justify-content:center}
  .book-visual{width:clamp(288px,86.4vw,456px)}
  .hero-quote{max-width:90%}
  .iv-index{padding:10px 10px;border-radius:18px;max-width:94%}
  .iv-index-head{padding:14px 8px;gap:8px;font-size:clamp(11px,3.4vw,13px)}

<script>
(function(){
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cursor = document.getElementById('reflection-cursor');
  var word = document.getElementById('reflection-word');
  var targets = [
    document.getElementById('reflection-kicker'),
    document.getElementById('reflection-line-1'),
    document.getElementById('reflection-line-2'),
    document.getElementById('reflection-line-3'),
    document.getElementById('reflection-subtext')
  ].filter(Boolean);

  function setWord(value){
    if (!word) return;
    word.classList.add('is-visible');
    word.innerHTML = '<span>' + value + '</span>';
  }

  function typeText(el, speed){
    return new Promise(function(resolve){
      var text = el.getAttribute('data-text') || '';
      if (reduceMotion){
        el.textContent = text;
        resolve();
        return;
      }
      var i = 0;
      function tick(){
        el.textContent = text.slice(0, i);
        if (i >= text.length){
          resolve();
          return;
        }
        i += 1;
        setTimeout(tick, speed);
      }
      tick();
    });
  }

  function wait(ms){
    return new Promise(function(resolve){ setTimeout(resolve, ms); });
  }

  async function run(){
    if (reduceMotion){
      targets.forEach(function(el){ el.textContent = el.getAttribute('data-text') || ''; });
      setWord('Future.');
      cursor?.classList.add('done');
      return;
    }

    await typeText(targets[0], 48);
    await wait(180);
    await typeText(targets[1], 42);
    await typeText(targets[2], 42);
    await typeText(targets[3], 42);
    await wait(240);
    setWord('Past.');
    await wait(620);
    setWord('Present.');
    await wait(620);
    setWord('Future.');
    await wait(240);
    if (targets[4]) await typeText(targets[4], 24);
    cursor?.classList.add('done');
  }

  run();
})();
</script>
