    <style>
      /* Static first-paint loader — pure CSS, no JS dependency, so it
         appears instantly and is automatically wiped the moment React
         mounts and calls render() on #root. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f172a;
      }
      #initial-loader img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: initial-loader-pulse 1.6s ease-in-out infinite;
      }
      #initial-loader p {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(212, 175, 55, 0.85);
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader img { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-live="polite">
        <img src="/images/da-logo.png" alt="" width="72" height="72" fetchpriority="high" />
        <p>Loading…</p>
      </div>
    </div>

  </body>
