    <style>
      /* A pre-React shell: it stays mounted long enough to receive the route's
         post-paint event, while keeping the actual route immediately beneath it. */
      #initial-loader {
        --ivory: #f8f2e7;
        --gold: #b8832f;
        --navy: #102744;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 47%, rgba(255, 255, 255, .94), transparent 20rem),
          radial-gradient(circle at 50% 58%, rgba(218, 174, 99, .1), transparent 28rem),
          var(--ivory);
        color: var(--navy);
        transition: opacity 180ms ease, visibility 0s linear 180ms;
      }
      #initial-loader.is-visible {
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease;
      }
      #initial-loader::before,
      #initial-loader::after {
        content: '';
        position: absolute;
        pointer-events: none;
      }
      #initial-loader::before {
        inset: 0;
        z-index: -2;
        opacity: .28;
        background-image: radial-gradient(rgba(77, 56, 27, .18) .55px, transparent .7px);
        background-size: 7px 7px;
        mix-blend-mode: multiply;
      }
      #initial-loader::after {
        z-index: 4;
        left: 50%;
        top: 47%;
        width: 32vmax;
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.04);
        background: radial-gradient(circle, #fffdf8 0 18%, rgba(255, 250, 238, .94) 39%, rgba(247, 233, 202, .58) 58%, transparent 73%);
      }
      #initial-loader.is-ready:not(.is-completing) {
        animation: initial-loader-dismiss 760ms cubic-bezier(.65, 0, .2, 1) forwards;
      }
      #initial-loader.is-ready:not(.is-completing)::after {
        animation: initial-loader-reveal 720ms cubic-bezier(.2, .7, .25, 1) forwards;
      }
      .initial-loader__field,
      .initial-loader__fragment {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .initial-loader__fragment { opacity: 0; }
      /* The crest is deliberately untouched; this is the living construction
         system around it. Its incomplete paths read as drafted geometry, not
         as a conventional loading spinner. */
      .initial-loader__orbit,
      .initial-loader__orbit-track,
      .initial-loader__orbit-radial,
      .initial-loader__orbit-intersection {
        position: absolute;
        left: 50%;
        top: 47%;
        pointer-events: none;
      }
      .initial-loader__orbit {
        width: clamp(24rem, 43vw, 36rem);
        height: clamp(18rem, 32vw, 27rem);
        border: 1px solid rgba(166, 115, 43, .24);
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg);
        animation: initial-loader-orbit-appear 840ms cubic-bezier(.2,.78,.25,1) 1.06s forwards;
      }
      .initial-loader__orbit--outer {
        border-right-color: transparent;
        border-bottom-color: transparent;
      }
      .initial-loader__orbit--middle {
        width: clamp(21rem, 37vw, 31rem);
        height: clamp(20rem, 35vw, 29rem);
        border-color: rgba(166, 115, 43, .18);
        border-left-color: transparent;
        border-bottom-color: transparent;
        transform: translate(-50%, -50%) rotate(27deg);
        animation-delay: 1.28s;
      }
      .initial-loader__orbit--inner {
        width: clamp(26rem, 45vw, 34rem);
        height: clamp(20rem, 35vw, 28rem);
        border-color: rgba(166, 115, 43, .2);
        border-top-color: transparent;
        border-right-color: transparent;
        transform: translate(-50%, -50%) rotate(-31deg);
        animation-delay: 1.46s;
      }
      .initial-loader__orbit-track {
        width: clamp(24rem, 43vw, 36rem);
        height: clamp(18rem, 32vw, 27rem);
        transform: translate(-50%, -50%);
        animation: initial-loader-orbit-turn 6.1s linear 1.16s infinite;
      }
      .initial-loader__orbit-tracer {
        position: absolute;
        left: 50%;
        top: -4px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c78b30;
        box-shadow: 0 0 0 2px rgba(255, 249, 231, .9), 0 0 .8rem .18rem rgba(190, 133, 38, .48);
      }
      .initial-loader__orbit-tracer::after {
        content: '';
        position: absolute;
        right: 5px;
        top: 3px;
        width: 1.75rem;
        height: 1px;
        transform-origin: right center;
        background: linear-gradient(90deg, transparent, rgba(196, 139, 47, .54));
      }
      .initial-loader__orbit-radial {
        width: clamp(10rem, 18vw, 15rem);
        height: 1px;
        transform-origin: left center;
        transform: rotate(-23deg);

        opacity: 0;
        animation: initial-loader-radial-pulse 9.7s ease-in-out 2.3s infinite;
      }
      .initial-loader__orbit-intersection {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(185, 128, 35, .92);
        box-shadow: 0 0 .55rem rgba(185, 128, 35, .45);
        opacity: 0;
        transform: translate(-50%, -50%);
        animation: initial-loader-intersection-pulse 7.9s ease-in-out 2.5s infinite;
      }
      .initial-loader__orbit-intersection--upper { margin: -10.4rem 0 0 12.6rem; }
      .initial-loader__orbit-intersection--lower { margin: 9.5rem 0 0 -13rem; animation-delay: 5.3s; }
      .initial-loader__fragment--arc-left {
        left: -19vw;
        top: 12vh;
        width: min(45vw, 36rem);
        height: min(45vw, 36rem);
        border: 1.15px solid rgba(166, 115, 43, .14);
        border-right-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
        transform: rotate(-26deg);
        animation: initial-loader-fragment-in 2.8s ease-out 5.15s forwards, initial-loader-arc-drift 21s ease-in-out 8.2s infinite alternate;
      }
      .initial-loader__fragment--arc-right {
        right: -13vw;

        height: min(32vw, 27rem);
        border: 1.15px solid rgba(166, 115, 43, .13);
        border-left-color: transparent;
        border-top-color: transparent;
        border-radius: 50%;
        transform: rotate(19deg);
        animation: initial-loader-fragment-in 3.2s ease-out 6.9s forwards, initial-loader-arc-drift 27s ease-in-out 10.2s infinite alternate-reverse;
      }
      .initial-loader__fragment--tangent {
        left: 11vw;
        bottom: 18vh;
        width: min(13rem, 20vw);
        height: 5rem;
        border-top: 1.15px solid rgba(166, 115, 43, .16);

      }
      .initial-loader__fragment--curve {
        right: 12vw;

        height: 4.5rem;

        animation: initial-loader-fragment-in 3.2s ease-out 8.55s forwards;
      }
      .initial-loader__fragment--proportion {
        right: 18vw;

        width: 7rem;
        height: 4rem;
        border-left: 1.15px solid rgba(166, 115, 43, .14);
        border-bottom: 1.15px solid rgba(166, 115, 43, .14);
        animation: initial-loader-fragment-in 3.5s ease-out 9.45s forwards;
      }
      .initial-loader__fragment--points {
        left: 23vw;
        top: 24vh;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(184, 131, 47, .72);
        box-shadow: 9rem 4rem 0 rgba(184, 131, 47, .36), 38rem -1rem 0 rgba(184, 131, 47, .3), 23rem 19rem 0 rgba(184, 131, 47, .24);
        animation: initial-loader-fragment-in 2.5s ease-out 5.85s forwards, initial-loader-point-breathe 13s ease-in-out 9s infinite alternate;
      }
      .initial-loader__field-point {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 18px 4px rgba(199, 142, 43, .32);
        transform: translate(-50%, -50%);
        animation: initial-loader-spark 1.4s ease-out both;
      }
      .initial-loader__composition {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        padding: 2rem 1.25rem 1.75rem;
        transform: translateY(-.4rem);
      }
      .initial-loader__crest {
        position: relative;
        width: clamp(15.5rem, 29vw, 23rem);
        /* Crop below the crest: the source file is a full lock-up, but the
           loading composition deliberately uses only its unchanged emblem. */
        /* One stable artboard: this small shared lower overscan clears the
           source crest point before the wordmark begins, for every layer. */
        aspect-ratio: 7 / 6;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 1.4rem 1.6rem rgba(61, 43, 20, .18));
        transform: translateZ(0);
      }
      .initial-loader__crest::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -4%;
        width: 72%;
        height: 12%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(188, 129, 42, .34), transparent 69%);
        filter: blur(11px);
        z-index: -1;
        animation: initial-loader-ground-glow 15.6s ease-in-out 3s infinite alternate;
      }
      .initial-loader__logo-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: auto;
        transform: translateY(-.5%);
        object-fit: contain;
        object-position: top center;
        transform-origin: 50% 50%;
        pointer-events: none;
      }
      .initial-loader__shield-interior {
        display: none;
      }
      .initial-loader__logo-layer--outline-top {
        z-index: 2;
        clip-path: none;
        opacity: 0;
        transform-origin: 50% 8%;
        animation: initial-loader-trace-top 500ms cubic-bezier(.25, .8, .28, 1) .62s forwards;
      }
      .initial-loader__logo-layer--outline-left {
        z-index: 2;
        /* Keep the mask on the shield stroke itself: the source lock-up's
           wreath starts just outside this perimeter. */
        clip-path: none;
        opacity: 0;
        transform-origin: 22% 13%;
        animation: initial-loader-trace-side 520ms cubic-bezier(.25, .8, .28, 1) .7s forwards;
      }
      .initial-loader__logo-layer--outline-right {
        z-index: 2;
        clip-path: none;
        opacity: 0;
        transform-origin: 78% 13%;
        animation: initial-loader-trace-side 520ms cubic-bezier(.25, .8, .28, 1) .76s forwards;
      }
      .initial-loader__logo-layer--outline-base {
        z-index: 2;
        clip-path: none;
        opacity: 0;
        transform-origin: 50% 90%;
        animation: initial-loader-trace-base 360ms ease-out 1.05s forwards;
      }
      .initial-loader__logo-layer--d {
        z-index: 3;
        /* A single shape-aware contour follows the navy D around the gold A,
           so the first monogram event reads as D rather than a logo crop. */
        /* Generous source-aligned overscan protects the D's serifs and bowl
           throughout its fade; colour isolation, not a tight crop, separates
           it from the A. */
        clip-path: none;
        filter: none;
        opacity: 0;
        animation: initial-loader-d 620ms cubic-bezier(.25, .8, .28, 1) 1.72s forwards;
      }
      .initial-loader__logo-layer--a {
        z-index: 5;

        clip-path: none;
        opacity: 0;
        animation: initial-loader-a 620ms cubic-bezier(.25, .8, .28, 1) 2.48s forwards;
      }
      .initial-loader__logo-layer--laurel-left {
        clip-path: none;
        transform-origin: 16% 88%;
        opacity: 0;
        z-index: 2;
        animation: initial-loader-laurel-left 820ms cubic-bezier(.2, .75, .25, 1) 3.23s forwards;
      }
      .initial-loader__logo-layer--laurel-right {
        clip-path: none;

      .initial-loader__logo-layer--star {
        clip-path: none;
        opacity: 0;

      }

      }

        const loader = document.getElementById('initial-loader');
        if (!loader) return;
        const isLocalReview = location.hostname === '127.0.0.1';
        const reviewParams = new URLSearchParams(location.search);
        const holdForLocalReview = isLocalReview && reviewParams.get('loaderHold') === '1';
        const reviewPhase = isLocalReview
          ? reviewParams.get('loaderPhase')
          : null;
        if (reviewPhase && ['initial', 'construction', 'assembly', 'd', 'a', 'laurels', 'complete', 'crest', 'world', 'ambient'].includes(reviewPhase)) {
          loader.classList.add(`is-review-${reviewPhase}`);
        }
        const showTimer = window.setTimeout(() => loader.classList.add('is-visible'), 120);
        const dismiss = () => {
          window.clearTimeout(showTimer);
          if (loader.classList.contains('is-completing') || loader.classList.contains('is-ready')) return;
          const tracerTrack = loader.querySelector('.initial-loader__orbit-track');
          if (tracerTrack) {
            const currentTransform = getComputedStyle(tracerTrack).transform;
            tracerTrack.style.setProperty('--tracer-current-transform', currentTransform === 'none' ? 'translate(-50%, -50%)' : currentTransform);

          const completionDuration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 420 : 1010;

          window.setTimeout(() => loader.remove(), completionDuration + 110);

        if (holdForLocalReview) {
          const releaseAfter = Number(reviewParams.get('loaderReleaseAfter'));
          if (Number.isFinite(releaseAfter) && releaseAfter > 0) {
            window.setTimeout(dismiss, releaseAfter);
          }
        } else {
          window.addEventListener('da:initial-route-painted', dismiss, { once: true });
        }
      })();
